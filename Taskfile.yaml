# Deploys the api-python workspace template onto an already-running Coder instance.
# Coder itself (EKS, RDS, Secrets Manager) is owned by the coder-demo-eks repo —
# run its infra/coder/init tasks first; this repo never touches infra.

version: '3'

dotenv: ['.env']

tasks:

  up:
    desc: Full demo — push template, provision a developer workspace
    cmds:
      - task: template
      - task: workspace

  template:
    desc: Push the workspace template to Coder, versioned from VERSION (bump it first for a new revision)
    cmds:
      - bash scripts/template.sh

  release:
    desc: Tag and push the current VERSION as a git release (vX.Y.Z)
    cmds:
      - git tag "v$(cat VERSION)"
      - git push origin "v$(cat VERSION)"

  workspace:
    desc: Provision a workspace from the template
    vars:
      NAME: '{{.NAME | default "dev-workspace"}}'
    cmds:
      - bash scripts/workspace.sh "{{.NAME}}"

  logs:
    desc: Stream startup logs from the active workspace
    cmds:
      - bash scripts/logs.sh

  validate:
    desc: Terraform fmt + validate and shellcheck
    cmds:
      - terraform -chdir=templates/api-python-workspace fmt -check
      - terraform -chdir=templates/api-python-workspace validate
      - shellcheck scripts/*.sh scripts/lib/coder.sh
